<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920" />
<title>11 · 转正 七百四十四万</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1080px; height:1920px; overflow:hidden; background:#000;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Sans CN",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage { position:relative; width:100%; height:100%; }
  .bg {
    position:absolute; inset:-12%;
    background-image:url('assets/bg.png');
    background-size:cover; background-position:50% 50%;
    transform:scale(1.55) translate(8%, 6%);
    filter:blur(0.4px) brightness(0.95);
  }
  .vignette {
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.6) 92%);
  }
  /* 窗外流动光斑（车外灯火） */
  .lights {
    position:absolute; right:-12%; top:10%; bottom:10%; width:50%;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,200,80,0.55), transparent 8%),
      radial-gradient(circle at 70% 60%, rgba(255,140,90,0.5), transparent 10%),
      radial-gradient(circle at 40% 80%, rgba(255,200,120,0.4), transparent 7%),
      radial-gradient(circle at 85% 30%, rgba(255,180,100,0.5), transparent 9%),
      radial-gradient(circle at 55% 50%, rgba(255,160,80,0.45), transparent 6%),
      radial-gradient(circle at 20% 55%, rgba(255,210,130,0.4), transparent 7%);
    filter:blur(14px); opacity:0;
  }

  .topbar {
    position:absolute; top:150px; left:50%; transform:translateX(-50%);
    text-align:center; opacity:0;
  }
  .topbar .year { font-size:40px; color:#ffa066; letter-spacing:0.3em; margin-bottom:14px; }
  .topbar .title {
    font-size:74px; font-weight:800; color:#fff; letter-spacing:0.06em;
    text-shadow:0 4px 30px rgba(0,0,0,0.9);
  }

  /* 手机屏幕框（模拟结算界面） */
  .phone {
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:540px; padding:42px 36px;
    background:linear-gradient(160deg, rgba(20,12,8,0.96), rgba(8,4,2,0.96));
    border:2px solid #ffa066; border-radius:18px;
    box-shadow:0 0 100px rgba(255,160,102,0.55), 0 30px 80px rgba(0,0,0,0.7);
    opacity:0;
  }
  .phone .label {
    font-size:36px; color:#ffb486; letter-spacing:0.22em; margin-bottom:18px;
  }
  .phone .num {
    font-size:220px; font-weight:900; color:#ffd6a8; line-height:0.95;
    text-shadow:0 0 60px rgba(255,200,140,0.65);
    letter-spacing:-0.02em;
  }
  .phone .cap {
    margin-top:14px; font-size:36px; color:#d8b4a0; letter-spacing:0.2em;
  }
  .phone .meta {
    margin-top:18px; font-size:28px; color:#a08575; letter-spacing:0.16em;
    border-top:1px solid rgba(255,180,120,0.25); padding-top:14px;
  }

  /* 「第一次」徽章 */
  .badge {
    position:absolute; left:50%; top:72%; transform:translate(-50%,-50%) scale(0.7);
    width:340px; padding:24px 0; text-align:center;
    background:linear-gradient(150deg, #ffd166, #ffa066);
    color:#5a2a14; font-size:56px; font-weight:900; letter-spacing:0.18em;
    border-radius:14px;
    box-shadow:0 0 80px rgba(255,180,80,0.5);
    opacity:0;
  }

  .subtitle {
    position:absolute; bottom:150px; left:50%; transform:translateX(-50%);
    font-size:58px; font-weight:700; color:#fff; white-space:nowrap; opacity:0;
    text-shadow:0 4px 24px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,1);
  }
.subtitle { opacity: 0 !important; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg" id="bg"></div>
  <div class="lights" id="lights"></div>
  <div class="vignette"></div>

  <div class="topbar" id="topbar">
    <div class="year">2025 年</div>
    <div class="title">转正 · 七百四十四万</div>
  </div>

  <div class="phone" id="phone">
    <div class="label">本 月 净 利</div>
    <div class="num" id="pnum">0</div>
    <div class="cap">万 元</div>
    <div class="meta">二 零 二 五 · 第 一 次 盈 利</div>
  </div>

  <div class="badge" id="badge">第 一 次</div>

  <div class="subtitle" id="subtitle"></div>
</div>

<script>
const bg = document.getElementById('bg');
const lights = document.getElementById('lights');
const topbar = document.getElementById('topbar');
const phone = document.getElementById('phone');
const pnum = document.getElementById('pnum');
const badge = document.getElementById('badge');
const subtitle = document.getElementById('subtitle');

const SUBS = [
  { t0:0.4,  t1:5.6,  text:'营收一百七十一亿元' },
  { t0:6.2,  t1:10.8, text:'全年七点九七亿单' },
  { t0:11.4, t1:16.8, text:'净利七百四十四万元' },
];

function lerp(a,b,t){ return a+(b-a)*t; }
function ease(t){ return 1-Math.pow(1-t,3); }
function clamp(x,lo,hi){ return Math.max(lo,Math.min(hi,x)); }
function win(t,s,e,f){ f=f||0.35;
  if (t<s||t>e) return 0;
  return Math.min(1, Math.min((t-s)/f,(e-t)/f));
}

function update(t){
  // === 运镜：0–4s 贴近侧脸（手机屏幕），4–12s 缓缓拉出车窗，12–17s 远景 ===
  if (t < 4) {
    const p = ease(t/4);
    bg.style.transform = `scale(${lerp(1.6,1.55,p)} translate(${lerp(12,10,p)}%, ${lerp(8,6,p)}%)`;
    bg.style.filter = `blur(${lerp(0.5,0.4,p)}px) brightness(${lerp(0.9,0.95,p)})`;
  } else if (t < 12) {
    const p = ease((t-4)/8);
    bg.style.transform = `scale(${lerp(1.55,1.1,p)}) translate(${lerp(10,2,p)}%, ${lerp(6,1,p)}%)`;
    bg.style.filter = `blur(${lerp(0.4,0.8,p)}px) brightness(${lerp(0.95,0.88,p)})`;
  } else {
    const p = ease((t-12)/5);
    bg.style.transform = `scale(${lerp(1.1,1.0,p)}) translate(${lerp(2,0,p)}%, ${lerp(1,0,p)}%)`;
    bg.style.filter = `blur(${lerp(0.8,1.2,p)}px) brightness(${lerp(0.88,0.85,p)})`;
  }

  // === 窗外灯火流动 ===
  if (t < 4) { lights.style.opacity='0'; }
  else if (t < 12) {
    const p = (t-4)/8;
    lights.style.opacity = String(Math.min(1, p*2));
    lights.style.transform = `translateX(${lerp(0, -25, p)}%)`;
  } else { lights.style.opacity='0.85'; lights.style.transform='translateX(-25%)'; }

  topbar.style.opacity = String(win(t, 0.8, 5.6, 0.5));

  // === 手机屏幕：2.2s 淡入，11s 起渐弱（拉出时被超越） ===
  if (t < 2.2) { phone.style.opacity='0'; }
  else if (t < 11) { phone.style.opacity='1'; }
  else if (t < 13) {
    const out = 1-(t-11)/2;
    phone.style.opacity=String(out);
    phone.style.transform = `translate(-50%,-50%) scale(${lerp(1, 0.86, 1-out)})`;
  } else { phone.style.opacity='0'; }

  // === 净利数字 0→744（万元）：3.5–8.5s ===
  if (t < 3.5) { pnum.textContent='0'; }
  else if (t < 8.5) { pnum.textContent = String(Math.round(744*ease((t-3.5)/5))); }
  else { pnum.textContent='744'; }

  // === 「第一次」徽章：10–15s 弹入 ===
  if (t < 10) { badge.style.opacity='0'; badge.style.transform='translate(-50%,-50%) scale(0.7)'; }
  else if (t < 10.8) {
    const p = ease((t-10)/0.8);
    const overshoot = p<0.7 ? lerp(0.7,1.1,ease(p/0.7)) : lerp(1.1,1,ease((p-0.7)/0.3));
    badge.style.opacity=String(p); badge.style.transform=`translate(-50%,-50%) scale(${overshoot})`;
  } else if (t < 15) {
    badge.style.opacity='1'; badge.style.transform='translate(-50%,-50%) scale(1)';
  } else { badge.style.opacity='0'; }

  // === 字幕 ===
  let st=0, txt='';
  for (const s of SUBS) if (t>=s.t0 && t<=s.t1) { st=win(t,s.t0,s.t1,0.4); txt=s.text; }
  subtitle.textContent = txt || SUBS[0].text;
  subtitle.style.opacity = String(st);
}

window.__update = update;
update(0);
</script>
</body>
</html>
