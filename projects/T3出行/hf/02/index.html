<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920" />
<title>02 · 落子 签约南京江宁</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1080px; height:1920px; overflow:hidden; background:#000;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Sans CN",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage { position:relative; width:100%; height:100%; }
  .bg {
    position:absolute; inset:-8%;
    background-image:url('assets/bg.png');
    background-size:cover; background-position:50% 30%;
    filter:blur(2px) brightness(0.78);
  }
  .vignette {
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.6) 92%);
  }

  .topbar {
    position:absolute; top:150px; left:50%; transform:translateX(-50%);
    text-align:center; opacity:0;
  }
  .topbar .year { font-size:40px; color:#d4af37; letter-spacing:0.3em; margin-bottom:14px; }
  .topbar .title {
    font-size:74px; font-weight:800; color:#fff; letter-spacing:0.06em;
    text-shadow:0 4px 30px rgba(0,0,0,0.9);
  }

  /* 背景板（模拟签约背景板） */
  .board {
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%) scale(0.94);
    width:920px; padding:52px 40px; text-align:center;
    background:linear-gradient(150deg, rgba(12,24,52,0.95), rgba(6,10,28,0.95));
    border:2px solid #4a7fd4; border-radius:14px;
    box-shadow:0 0 90px rgba(74,127,212,0.28), 0 24px 60px rgba(0,0,0,0.6);
    opacity:0;
  }
  .board .b-title {
    font-size:66px; font-weight:800; color:#eaf2ff; letter-spacing:0.1em; line-height:1.3;
  }
  .board .b-sub {
    margin-top:22px; font-size:34px; color:#8fa8cc; letter-spacing:0.2em;
  }
  /* 背景板灯光（亮起时整块发光） */
  .board::after {
    content:''; position:absolute; inset:0; border-radius:14px; pointer-events:none;
    background:linear-gradient(120deg, rgba(140,200,255,0.55), rgba(255,255,255,0.18) 45%, rgba(140,200,255,0.5));
    opacity:0;
  }

  /* 笔尖提示 */
  .pen-hint {
    position:absolute; left:50%; top:62%; transform:translateX(-50%);
    font-size:48px; color:#f5e9d0; letter-spacing:0.24em; opacity:0;
    text-shadow:0 0 36px rgba(212,175,55,0.65);
  }

  /* 投资金额 */
  .invest {
    position:absolute; left:50%; top:68%; transform:translateX(-50%);
    text-align:center; opacity:0;
  }
  .invest .num {
    font-size:150px; font-weight:900; color:#ffd166; line-height:1;
    text-shadow:0 0 60px rgba(255,209,102,0.6);
  }
  .invest .cap {
    margin-top:14px; font-size:38px; color:#d8e4f5; letter-spacing:0.2em;
  }

  .flash {
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 40%,
      rgba(255,245,220,0.9), rgba(190,225,255,0.4) 30%, transparent 68%);
  }

  .subtitle {
    position:absolute; bottom:150px; left:50%; transform:translateX(-50%);
    font-size:58px; font-weight:700; color:#fff; white-space:nowrap; opacity:0;
    text-shadow:0 4px 24px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,1);
  }
.subtitle { opacity: 0 !important; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg" id="bg"></div>
  <div class="vignette"></div>

  <div class="topbar" id="topbar">
    <div class="year">2019 年 3 月</div>
    <div class="title">落子 · 签约南京江宁</div>
  </div>

  <div class="board" id="board">
    <div class="b-title">智慧出行平台项目签约</div>
    <div class="b-sub">南 京 · 江 宁</div>
  </div>

  <div class="pen-hint" id="penHint">落 笔 签 约</div>

  <div class="invest" id="invest">
    <div class="num" id="invNum">0</div>
    <div class="cap">总 投 资（亿元）</div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="subtitle" id="subtitle"></div>
</div>

<script>
const bg = document.getElementById('bg');
const topbar = document.getElementById('topbar');
const board = document.getElementById('board');
const penHint = document.getElementById('penHint');
const invest = document.getElementById('invest');
const invNum = document.getElementById('invNum');
const flash = document.getElementById('flash');
const subtitle = document.getElementById('subtitle');

const SUBS = [
  { t0:0.4,  t1:6.0,  text:'三大央企联手腾讯 · 阿里' },
  { t0:6.6,  t1:12.0, text:'南京签下合资协议' },
  { t0:12.6, t1:18.2, text:'四月 · 南京领行科技成立' },
];

function lerp(a,b,t){ return a+(b-a)*t; }
function ease(t){ return 1-Math.pow(1-t,3); }
function clamp(x,lo,hi){ return Math.max(lo,Math.min(hi,x)); }
function win(t,s,e,f){ f=f||0.35;
  if (t<s||t>e) return 0;
  return Math.min(1, Math.min((t-s)/f,(e-t)/f));
}

function update(t){
  // === 运镜：0–6s 从背景板上方缓缓下摇，6–11s 推近笔尖，之后保持 ===
  if (t < 6) {
    const p = ease(t/6);
    bg.style.transform = `scale(${lerp(1.02,1.14,p)}) translate(${lerp(0,-1,p)}%, ${lerp(-9,4,p)}%)`;
    bg.style.filter = `blur(${lerp(3,1.8,p)}px) brightness(${lerp(0.62,0.8,p)})`;
  } else if (t < 11) {
    const p = ease((t-6)/5);
    bg.style.transform = `scale(${lerp(1.14,1.48,p)}) translate(${lerp(-1,2,p)}%, ${lerp(4,7,p)}%)`;
    bg.style.filter = `blur(${lerp(1.8,0.4,p)}px) brightness(${lerp(0.8,0.95,p)})`;
  } else {
    bg.style.transform = 'scale(1.48) translate(2%,7%)';
    bg.style.filter = 'blur(0.4px) brightness(0.95)';
  }

  topbar.style.opacity = String(win(t, 1.0, 5.8, 0.5));

  // === 背景板：2.2s 淡入，9.5s 灯光亮起 ===
  if (t < 2.2) {
    board.style.opacity='0'; board.style.transform='translate(-50%,-50%) scale(0.94)';
  } else if (t < 3.2) {
    const p = ease((t-2.2));
    board.style.opacity=String(p); board.style.transform=`translate(-50%,-50%) scale(${lerp(0.94,1,p)})`;
  } else {
    board.style.opacity='1'; board.style.transform='translate(-50%,-50%) scale(1)';
  }
  // 灯光：9.6s 骤亮后回落
  let glow = 0;
  if (t >= 9.6 && t < 9.9) glow = (t-9.6)/0.3;
  else if (t >= 9.9 && t < 10.6) glow = 1 - (t-9.9)/0.7*0.7;
  else if (t >= 10.6) glow = 0.3;
  board.style.setProperty('--glow', String(glow));
  // ::after 无法直接设，改用 box-shadow + filter 模拟
  const gs = glow;
  board.style.boxShadow = `0 0 ${90+120*gs}px rgba(${lerp(74,150,gs)|0},${lerp(127,200,gs)|0},255,${0.28+0.55*gs}), 0 24px 60px rgba(0,0,0,0.6)`;
  board.style.filter = `brightness(${1+0.55*gs}) saturate(${1+0.3*gs})`;

  // === 笔锋顿住提示：7.5–11.5s ===
  penHint.style.opacity = String(win(t, 7.5, 11.5, 0.6));

  // === 投资数字 0→97（近百亿）：11.5–14.5s ===
  if (t < 11.5) { invest.style.opacity='0'; invNum.textContent='0'; }
  else if (t < 14.5) {
    invest.style.opacity = String(Math.min(1,(t-11.5)/0.5));
    invNum.textContent = String(Math.round(97*ease((t-11.5)/3)));
  } else {
    invest.style.opacity='1'; invNum.textContent='97';
  }

  // === 灯光亮起瞬间的闪光：9.6–10.2s ===
  let fv = 0;
  if (t>=9.6 && t<9.75) fv = (t-9.6)/0.15*0.85;
  else if (t>=9.75 && t<10.4) fv = 0.85*Math.pow(1-(t-9.75)/0.65, 2);
  flash.style.opacity = String(fv);

  // === 字幕 ===
  let st=0, txt='';
  for (const s of SUBS) if (t>=s.t0 && t<=s.t1) { st=win(t,s.t0,s.t1,0.4); txt=s.text; }
  subtitle.textContent = txt || SUBS[0].text;
  subtitle.style.opacity = String(st);
}

window.__update = update;
update(0);
</script>
</body>
</html>
