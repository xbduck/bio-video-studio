<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920" />
<title>01 · 缘起 三厂握手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1080px; height:1920px; overflow:hidden; background:#000;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Sans CN",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage { position:relative; width:100%; height:100%; }
  .bg {
    position:absolute; inset:-8%;
    background-image:url('assets/bg.png');
    background-size:cover; background-position:50% 40%;
    transform:scale(1.02);
    filter:blur(2px) brightness(0.8);
  }
  .vignette {
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.6) 92%);
  }

  /* 三块企业铭牌，依次滑入 */
  .cards {
    position:absolute; left:0; right:0; top:58%;
    display:flex; justify-content:center; gap:32px;
  }
  .card {
    width:250px; padding:26px 14px;
    background:linear-gradient(160deg, rgba(18,26,48,0.96), rgba(8,10,24,0.96));
    border:2px solid #d4af37; border-radius:12px;
    box-shadow:0 0 60px rgba(212,175,55,0.4), 0 20px 50px rgba(0,0,0,0.6);
    text-align:center;
    transform:translateY(60px) scale(0.9); opacity:0;
  }
  .card .name {
    font-size:46px; font-weight:800; color:#f5e9d0;
    letter-spacing:0.08em; line-height:1.25;
    text-shadow:0 0 26px rgba(212,175,55,0.5);
  }
  .card .role {
    margin-top:10px; font-size:24px; color:#9fb0c8; letter-spacing:0.14em;
  }

  /* 顶部标题条 */
  .topbar {
    position:absolute; top:150px; left:50%; transform:translateX(-50%);
    text-align:center; opacity:0;
  }
  .topbar .year {
    font-size:40px; color:#d4af37; letter-spacing:0.3em; margin-bottom:14px;
  }
  .topbar .title {
    font-size:76px; font-weight:800; color:#fff; letter-spacing:0.06em;
    text-shadow:0 4px 30px rgba(0,0,0,0.9);
  }

  /* 落笔提示 */
  .sign-hint {
    position:absolute; left:50%; top:44%; transform:translateX(-50%);
    font-size:52px; color:#f5e9d0; letter-spacing:0.2em; opacity:0;
    text-shadow:0 0 40px rgba(212,175,55,0.7);
  }

  /* 闪光灯 */
  .flash {
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 38% 42%,
      rgba(255,255,255,0.98), rgba(255,250,235,0.7) 22%, rgba(255,240,210,0.25) 45%, transparent 70%);
  }

  .subtitle {
    position:absolute; bottom:150px; left:50%; transform:translateX(-50%);
    font-size:60px; font-weight:700; color:#fff; white-space:nowrap; opacity:0;
    text-shadow:0 4px 24px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,1);
  }
.subtitle { opacity: 0 !important; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg" id="bg"></div>
  <div class="vignette"></div>

  <div class="topbar" id="topbar">
    <div class="year">2018 年 7 月</div>
    <div class="title">缘起 · 三厂握手</div>
  </div>

  <div class="sign-hint" id="signHint">签 署 意 向 书</div>

  <div class="cards">
    <div class="card" id="card1"><div class="name">中国一汽</div><div class="role">汽 车 央 企</div></div>
    <div class="card" id="card2"><div class="name">东风汽车</div><div class="role">汽 车 央 企</div></div>
    <div class="card" id="card3"><div class="name">长安汽车</div><div class="role">汽 车 央 企</div></div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="subtitle" id="subtitle"></div>
</div>

<script>
const bg = document.getElementById('bg');
const topbar = document.getElementById('topbar');
const signHint = document.getElementById('signHint');
const cards = [1,2,3].map(i => document.getElementById('card'+i));
const flash = document.getElementById('flash');
const subtitle = document.getElementById('subtitle');

const SUBS = [
  { t0:0.4,  t1:6.2,  text:'一汽 · 东风 · 长安' },
  { t0:6.8,  t1:11.8, text:'三家汽车央企落笔' },
  { t0:12.4, t1:16.4, text:'由造车的人，自己来运营出行' },
];

function lerp(a,b,t){ return a+(b-a)*t; }
function ease(t){ return 1-Math.pow(1-t,3); }
function clamp(x,lo,hi){ return Math.max(lo,Math.min(hi,x)); }
// 淡入淡出窗口
function win(t, s, e, fade){ fade = fade||0.35;
  if (t < s || t > e) return 0;
  return Math.min(1, Math.min((t-s)/fade, (e-t)/fade));
}

function update(t){
  // === 运镜：0–5s 横移掠过铭牌，5–10s 推近落笔 ===
  if (t < 5) {
    const p = ease(t/5);
    bg.style.transform = `scale(${lerp(1.02,1.16,0)}) translate(${lerp(-7,5,p)}%, ${lerp(0,-2,p)}%)`;
    bg.style.filter = `blur(${lerp(2.5,1.6,p)}px) brightness(${lerp(0.75,0.85,p)})`;
  } else if (t < 10) {
    const p = ease((t-5)/5);
    bg.style.transform = `scale(${lerp(1.16,1.5,p)}) translate(${lerp(5,-2,p)}%, ${lerp(-2,-6,p)}%)`;
    bg.style.filter = `blur(${lerp(1.6,0.4,p)}px) brightness(${lerp(0.85,0.95,p)})`;
  } else {
    bg.style.transform = 'scale(1.5) translate(-2%,-6%)';
    bg.style.filter = 'blur(0.4px) brightness(0.95)';
  }

  // === 顶部标题：1.0–5.5s ===
  topbar.style.opacity = String(win(t, 1.0, 5.5, 0.5));

  // === 三块铭牌依次滑入：2.0 / 3.3 / 4.6s，停留到 14s ===
  cards.forEach((c, i) => {
    const s = 2.0 + i*1.3;
    if (t < s) { c.style.opacity='0'; c.style.transform='translateY(60px) scale(0.9)'; return; }
    const p = ease(clamp((t-s)/0.7, 0, 1));
    const out = t > 14.2 ? 1 - clamp((t-14.2)/0.8, 0, 1) : 1;
    c.style.opacity = String(p*out);
    c.style.transform = `translateY(${lerp(60,0,p)}px) scale(${lerp(0.9,1,p)})`;
  });

  // === 落笔提示：7.5–11.5s ===
  signHint.style.opacity = String(win(t, 7.5, 11.5, 0.6));

  // === 闪光灯接连亮起：9.0 / 9.9 / 10.8 / 11.7s ===
  const flashTimes = [9.0, 9.9, 10.8, 11.7];
  let fv = 0;
  for (const ft of flashTimes) {
    const d = t - ft;
    if (d >= 0 && d < 0.42) {
      // 快起慢落
      fv = Math.max(fv, d < 0.06 ? d/0.06 : Math.pow(1 - (d-0.06)/0.36, 2));
    }
  }
  flash.style.opacity = String(fv);

  // === 字幕三段 ===
  let st = 0, txt = '';
  for (const s of SUBS) {
    if (t >= s.t0 && t <= s.t1) { st = win(t, s.t0, s.t1, 0.4); txt = s.text; }
  }
  subtitle.textContent = txt || SUBS[0].text;
  subtitle.style.opacity = String(st);
}

window.__update = update;
update(0);
</script>
</body>
</html>
